[package]
name = "aktyn-shell"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "aktyn-shell"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
gpui = { git = "https://github.com/zed-industries/zed", branch = "main", features = ["wayland"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", branch = "main", features = ["wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
zbus = "5.19"

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", branch = "main", features = ["test-support"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", branch = "main", features = ["test-support"] }
